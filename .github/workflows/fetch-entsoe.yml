name: Fetch ENTSO-E data

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install entsoe-py pandas python-dateutil

      - name: Fetch latest ENTSO-E data
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: python fetch_entsoe_data.py --token "$ENTSOE_TOKEN" --days 30 --out entsoe_data.json

      - name: Configure git user name
        run: git config user.name "entsoe-data-bot"

      - name: Configure git user email
        run: git config user.email "actions@users.noreply.github.com"

      - name: Stage data file
        run: git add entsoe_data.json

      - name: Commit if changed
        run: git commit -m "Update ENTSO-E data" || echo "No changes to commit"

      - name: Push
        run: git push
